name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g. v0.1.0, or v0.1.0-rc1 for a pre-release)"
        required: true
      prerelease:
        description: "Pre-release: mark the GitHub release as a pre-release and don't update the Homebrew tap. Tags with a '-' suffix are always pre-releases."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      bundle-version: ${{ steps.version.outputs.bundle-version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE_INPUT: ${{ inputs.prerelease || false }}
        run: |
          VERSION="${TAG#v}"
          # CFBundleShortVersionString must be numeric: v1.2.0-rc1 -> 1.2.0
          BUNDLE_VERSION="${VERSION%%-*}"
          PRERELEASE=false
          if [ "$PRERELEASE_INPUT" = true ] || [ "$VERSION" != "$BUNDLE_VERSION" ]; then
            PRERELEASE=true
          fi
          echo "tag=$TAG"                       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"               >> "$GITHUB_OUTPUT"
          echo "bundle-version=$BUNDLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE"         >> "$GITHUB_OUTPUT"

  build-arm64:
    needs: resolve-version
    runs-on: macos-26
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up signing
        id: signing
        uses: ./.github/actions/setup-signing
        with:
          certificate-p12-base64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          certificate-password: ${{ secrets.BUILD_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          app-profile-base64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          camera-profile-base64: ${{ secrets.CAMERA_PROVISIONING_PROFILE_BASE64 }}
          team-id: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Build & archive
        run: |
          xcodebuild -project LensBar/LensBar.xcodeproj \
            -scheme LensBar -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -archivePath build/LensBar.xcarchive archive \
            ARCHS=arm64 \
            MARKETING_VERSION="${{ needs.resolve-version.outputs.bundle-version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="${{ secrets.DEVELOPER_ID_IDENTITY }}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            LENSBAR_APP_PROFILE="${{ steps.signing.outputs.app-profile-name }}" \
            LENSBAR_CAMERA_PROFILE="${{ steps.signing.outputs.camera-profile-name }}"

      - name: Export .app
        env:
          APP_PROFILE: ${{ steps.signing.outputs.app-profile-name }}
          CAMERA_PROFILE: ${{ steps.signing.outputs.camera-profile-name }}
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfiles:com.andrewcraig.LensBar \"$APP_PROFILE\"" \
            -c "Set :provisioningProfiles:com.andrewcraig.LensBar.Camera \"$CAMERA_PROFILE\"" \
            ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/LensBar.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Verify signature and entitlements
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: scripts/verify-signing.sh build/export/LensBar.app pre-notarize "arm64"

      - name: Notarize & staple app
        env:
          P8_B64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$P8_B64" | base64 -d > key.p8
          ditto -c -k --keepParent build/export/LensBar.app LensBar.zip
          xcrun notarytool submit LensBar.zip \
            --key key.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait
          xcrun stapler staple build/export/LensBar.app

      - name: Verify notarized app
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: scripts/verify-signing.sh build/export/LensBar.app post-staple "arm64"

      - name: Package, sign, notarize & staple DMG
        env:
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          hdiutil create -volname LensBar -srcfolder build/export/LensBar.app \
            -ov -format UDZO LensBar.dmg
          codesign --sign "${{ secrets.DEVELOPER_ID_IDENTITY }}" \
            --timestamp LensBar.dmg
          xcrun notarytool submit LensBar.dmg \
            --key key.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait
          xcrun stapler staple LensBar.dmg
          rm key.p8
          spctl -a -vv -t open --context context:primary-signature LensBar.dmg

      - name: Compute checksum
        id: sha
        run: echo "sha256=$(shasum -a 256 LensBar.dmg | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LensBar.dmg
          path: LensBar.dmg

  build-universal:
    needs: resolve-version
    runs-on: macos-26
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up signing
        id: signing
        uses: ./.github/actions/setup-signing
        with:
          certificate-p12-base64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          certificate-password: ${{ secrets.BUILD_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          app-profile-base64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          camera-profile-base64: ${{ secrets.CAMERA_PROVISIONING_PROFILE_BASE64 }}
          team-id: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Build & archive
        run: |
          xcodebuild -project LensBar/LensBar.xcodeproj \
            -scheme LensBar -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/LensBar.xcarchive archive \
            ARCHS="arm64 x86_64" \
            MARKETING_VERSION="${{ needs.resolve-version.outputs.bundle-version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="${{ secrets.DEVELOPER_ID_IDENTITY }}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            LENSBAR_APP_PROFILE="${{ steps.signing.outputs.app-profile-name }}" \
            LENSBAR_CAMERA_PROFILE="${{ steps.signing.outputs.camera-profile-name }}"

      - name: Export .app
        env:
          APP_PROFILE: ${{ steps.signing.outputs.app-profile-name }}
          CAMERA_PROFILE: ${{ steps.signing.outputs.camera-profile-name }}
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfiles:com.andrewcraig.LensBar \"$APP_PROFILE\"" \
            -c "Set :provisioningProfiles:com.andrewcraig.LensBar.Camera \"$CAMERA_PROFILE\"" \
            ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/LensBar.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Verify signature and entitlements
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: scripts/verify-signing.sh build/export/LensBar.app pre-notarize "arm64 x86_64"

      - name: Notarize & staple app
        env:
          P8_B64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$P8_B64" | base64 -d > key.p8
          ditto -c -k --keepParent build/export/LensBar.app LensBar.zip
          xcrun notarytool submit LensBar.zip \
            --key key.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait
          xcrun stapler staple build/export/LensBar.app

      - name: Verify notarized app
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: scripts/verify-signing.sh build/export/LensBar.app post-staple "arm64 x86_64"

      - name: Package, sign, notarize & staple DMG
        env:
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          hdiutil create -volname LensBar -srcfolder build/export/LensBar.app \
            -ov -format UDZO LensBar-universal.dmg
          codesign --sign "${{ secrets.DEVELOPER_ID_IDENTITY }}" \
            --timestamp LensBar-universal.dmg
          xcrun notarytool submit LensBar-universal.dmg \
            --key key.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait
          xcrun stapler staple LensBar-universal.dmg
          rm key.p8
          spctl -a -vv -t open --context context:primary-signature LensBar-universal.dmg

      - name: Compute checksum
        id: sha
        run: echo "sha256=$(shasum -a 256 LensBar-universal.dmg | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LensBar-universal.dmg
          path: LensBar-universal.dmg

  publish-release:
    needs: [resolve-version, build-arm64, build-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LensBar.dmg

      - uses: actions/download-artifact@v4
        with:
          name: LensBar-universal.dmg

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            LensBar.dmg
            LensBar-universal.dmg
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          # A dispatch run creates the tag on the commit it built, not the
          # default branch, so a pre-release can come from a feature branch.
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}

  update-homebrew-tap:
    needs: [resolve-version, build-arm64, build-universal, publish-release]
    if: needs.resolve-version.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: andrew-craig/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render cask
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          ARM_SHA256: ${{ needs.build-arm64.outputs.sha256 }}
          INTEL_SHA256: ${{ needs.build-universal.outputs.sha256 }}
        run: |
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__ARM_SHA256__/${ARM_SHA256}/g" \
            -e "s/__INTEL_SHA256__/${INTEL_SHA256}/g" \
            Casks/lensbar.rb.tmpl > tap/Casks/lensbar.rb

      - name: Commit & push
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/lensbar.rb
          if git diff --cached --quiet; then
            echo "No cask changes to commit"
            exit 0
          fi
          git commit -m "lensbar ${VERSION}"
          git push
